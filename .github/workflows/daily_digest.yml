name: Daily Global Seismic Digest

on:
  schedule:
    # Runs daily at 23:59 UTC (end of the international day)
    - cron: '59 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate video but skip Meta publishing)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-seismic-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r earthquake_tracker/requirements.txt

      - name: Run Daily Global Seismic Digest Pipeline
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY || secrets.GEOAPIFY_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python earthquake_tracker/daily_digest.py --dry-run
          else
            python earthquake_tracker/daily_digest.py
          fi

      - name: Upload Digest Video Artifacts (Optional backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-digest-videos-${{ github.run_id }}
          path: earthquake_tracker/output/*.mp4
          retention-days: 7
