name: 24/7 Earthquake Tracker Bot

on:
  workflow_dispatch: # Triggered externally by cron-job.org every 5 minutes

permissions:
  contents: write

# Prevent duplicate runs - if a new trigger arrives while one is running, cancel the new one
concurrency:
  group: earthquake-tracker
  cancel-in-progress: false

jobs:
  track-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          pip install -r earthquake_tracker/requirements.txt

      - name: Run Earthquake Tracker Engine
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '1305415129314506' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python earthquake_tracker/tracker_pipeline.py

      - name: Commit and Push History State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add earthquake_tracker/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update earthquake posted history [skip ci]" && git pull --rebase origin main && git push)
