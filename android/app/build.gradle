plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bikroynow.bd'
    compileSdk 34

    defaultConfig {
        applicationId "com.bikroynow.bd"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("../bikroynow-release.jks")
            storePassword "bikroynow2026"
            keyAlias "bikroynow"
            keyPassword "bikroynow2026"
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
