<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Vibrant Orange Rounded Square App Icon -->
  <rect width="512" height="512" rx="120" fill="url(#orangeGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="6" />

  <!-- Smiling Face & NOW Text -->
  <g filter="url(#softShadow)">
    <!-- Eyes -->
    <circle cx="190" cy="180" r="28" fill="#FFFFFF" />
    <circle cx="322" cy="180" r="28" fill="#FFFFFF" />

    <!-- Smile Curve -->
    <path d="M 148 245 Q 256 345 364 245" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" fill="none" />

    <!-- "NOW" Bold Text -->
    <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="95" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">NOW</text>
  </g>
</svg>
