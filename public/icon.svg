<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008b5e" />
      <stop offset="100%" stop-color="#00583b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- Center Shopping / Smile Box -->
  <g filter="url(#glow)">
    <!-- Golden Accent Banner Box (NOW / Smile) -->
    <rect x="96" y="120" width="320" height="260" rx="48" fill="#ffffff" />

    <!-- Cute Smiling Eyes & Smile (BikroyNow Smile Logo) -->
    <circle cx="190" cy="200" r="22" fill="#008b5e" />
    <circle cx="322" cy="200" r="22" fill="#008b5e" />
    <path d="M 170 270 Q 256 345 342 270" stroke="#008b5e" stroke-width="22" stroke-linecap="round" fill="none" />

    <!-- "NOW" Golden Tag -->
    <rect x="176" y="340" width="160" height="54" rx="27" fill="url(#goldGrad)" />
    <text x="256" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="2">NOW</text>
  </g>
</svg>
