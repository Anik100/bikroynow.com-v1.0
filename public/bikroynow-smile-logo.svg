<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <style>
    .brand-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 900; fill: #FFFFFF; font-size: 72px; }
    .dot-com { font-family: 'Inter', system-ui, sans-serif; font-weight: 900; fill: #FFB703; font-size: 56px; }
  </style>

  <!-- Bikroy -->
  <text x="20" y="100" class="brand-text">Bikroy</text>

  <!-- Smile Badge Icon (Without NOW text) -->
  <g transform="translate(250, 30)">
    <rect x="0" y="0" width="85" height="85" rx="22" fill="url(#badgeGradient)" />
    <!-- Eyes -->
    <circle cx="28" cy="32" r="6" fill="#FFFFFF" />
    <circle cx="57" cy="32" r="6" fill="#FFFFFF" />
    <!-- Smile Curve -->
    <path d="M 20 50 Q 42.5 72 65 50" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" />
  </g>

  <!-- .com -->
  <text x="350" y="100" class="dot-com">.com</text>
</svg>
