<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFB703" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Center Yellow Smile Badge -->
  <g transform="translate(250, 250)" filter="url(#glow)">
    <rect width="300" height="300" rx="75" fill="url(#badgeGrad)" />
    <!-- Eyes -->
    <circle cx="100" cy="120" r="22" fill="#FFFFFF" />
    <circle cx="200" cy="120" r="22" fill="#FFFFFF" />
    <!-- Smile Mouth -->
    <path d="M 70 185 Q 150 270 230 185" stroke="#FFFFFF" stroke-width="26" fill="none" stroke-linecap="round" />
  </g>
</svg>
