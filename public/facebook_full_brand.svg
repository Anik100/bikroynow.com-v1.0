<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <style>
    .brand-txt { font-family: 'Inter', system-ui, sans-serif; font-weight: 900; fill: #FFFFFF; font-size: 96px; }
    .dotcom-txt { font-family: 'Inter', system-ui, sans-serif; font-weight: 900; fill: #FFB703; font-size: 80px; }
  </style>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad2)" />

  <!-- Centered Logo Group -->
  <g transform="translate(60, 330)">
    <!-- Bikroy -->
    <text x="0" y="110" class="brand-txt">Bikroy</text>

    <!-- Smile Badge Icon -->
    <g transform="translate(320, 20)">
      <rect x="0" y="0" width="115" height="115" rx="30" fill="url(#badgeGrad2)" />
      <circle cx="38" cy="44" r="9" fill="#FFFFFF" />
      <circle cx="77" cy="44" r="9" fill="#FFFFFF" />
      <path d="M 28 68 Q 57.5 98 87 68" stroke="#FFFFFF" stroke-width="10" fill="none" stroke-linecap="round" />
    </g>

    <!-- .com -->
    <text x="460" y="110" class="dotcom-txt">.com</text>
  </g>
</svg>
